<head>
  <meta charset="utf-8">
  <!-- interactive-widget: on Android, shrink the page when the keyboard opens
       (iOS is handled in app.js with the visualViewport API). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <!-- The background before style.css arrives, so a dark phone doesn't flash white. -->
  <style>html { background: #f6f7f9; } @media (prefers-color-scheme: dark) { html { background: #0f1115; } }</style>
  <title>tymlee</title>
  <!-- Home Screen: its own icon and name, opening full screen without browser bars. -->

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="tymlee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
  <div id="app">
    <main id="scroll">
      <div id="out" role="log" aria-live="polite"></div>
      <div id="gui" hidden></div>
      <div id="divider" hidden role="button" tabindex="0" aria-label="Console: drag to resize, click to fold" aria-expanded="true">
        <span class="divider-label">console</span><span class="grip" aria-hidden="true"></span>
      </div>
    </main>
    <div id="dock">
      <div class="col">
        <div id="prompt">
          <span class="ps1" aria-hidden="true">&gt;</span>
          <div class="field">
            <div id="ghost" aria-hidden="true"></div>
            <input id="entry" name="tymlee-command" type="text" autocomplete="off" data-1p-ignore data-lpignore="true" data-form-type="other" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus
                   enterkeyhint="send" aria-label="Entry or command" aria-describedby="matches">
          </div>
        </div>
        <div id="matches"></div>
      </div>
      <div id="about"></div>
      <footer id="status"></footer>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="build.js"></script>
  <script src="core.js"></script>
  <script src="vault.js"></script>
  <script src="idb.js"></script>
  <script src="store.js"></script>
  <script src="commands.js"></script>
  <script src="timeline.js"></script>
  <script src="gui.js"></script>
  <script src="app.js"></script>
</body>
</html>
