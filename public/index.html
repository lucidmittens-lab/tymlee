<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tymlee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="term">
    <div id="out" role="log" aria-live="polite"></div>
    <form id="prompt" autocomplete="off">
      <span class="ps1" aria-hidden="true">&gt;</span>
      <div class="field">
        <div id="ghost" aria-hidden="true"></div>
        <input id="entry" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" autofocus
               aria-label="Entry or command" aria-describedby="matches">
      </div>
    </form>
    <div id="matches"></div>
  </main>
  <footer id="status"></footer>

  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
